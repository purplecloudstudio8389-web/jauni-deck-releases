name: JauniDeck 자동 빌드 및 배포

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            command: npm run build:windows
            artifact: windows
          - os: macos-latest
            command: npm run build:mac
            artifact: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: 소스 불러오기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 20
          

      - name: 업데이트 주소 설정
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.build=p.build||{};p.build.publish=[{provider:'github',owner:'purplecloudstudio8389-web',repo:'jauni-deck-releases'}];fs.writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: 필요한 파일 설치
        run: npm install

      - name: Windows와 Mac 프로그램 만들기
        run: ${{ matrix.command }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 완성 파일 보관
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 소스 불러오기
        uses: actions/checkout@v4

      - name: 완성 파일 모으기
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: 버전 확인
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 새 버전 공개
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 자우니덱 v${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: release-files/*
