<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8b5cf6"><title>자우니덱</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><span class="cloud">☁</span><b>자우니덱</b></div><div class="headright"><a id="feedback" href="mailto:pcs8389@naver.com?subject=자우니덱 베타 피드백">피드백 보내기</a><span id="state">연결 확인 중</span></div></header>
<main>
  <section id="desktopPanel" class="card desktopPanel" hidden><h1>연결 준비 완료</h1><p>휴대폰이나 태블릿을 같은 와이파이에 연결한 후 아래 주소로 접속하세요.</p><div class="connectionBox"><small>접속 주소</small><strong id="desktopUrl"></strong></div><div class="connectionBox"><small>6자리 연결번호</small><strong id="desktopCode"></strong></div><p class="hint">이 프로그램을 종료하면 휴대폰 연결도 함께 종료됩니다. 새 업데이트가 있으면 설치 전에 먼저 알려드립니다.</p></section>
  <section id="pair" class="card"><h1>컴퓨터 연결</h1><p id="computer">같은 와이파이에 연결되어 있어야 해요.</p><label>컴퓨터 화면의 6자리 연결번호</label><div class="pairline"><input id="code" inputmode="numeric" maxlength="6" placeholder="000000"><button id="connect">연결하기</button></div></section>
  <section id="deck" hidden><div class="topline"><div><b id="pcname">내 컴퓨터</b><small>길게 눌러 버튼 편집</small></div><button id="disconnect">연결 해제</button></div><nav id="pages"></nav><div id="grid" class="grid"></div><div class="deckactions"><button id="add" class="add">＋ 버튼 추가</button><button id="addPage" class="add">＋ 페이지 추가</button><button id="pageMenu" class="add">페이지 관리</button></div></section>
</main>
<dialog id="editor"><form method="dialog"><h2 id="editorTitle">버튼 만들기</h2><label>버튼 이름<input id="label" maxlength="20" placeholder="예: 저장"></label><label>아이콘 이미지<input id="iconFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label><div id="iconPreview">⚡</div><label>버튼 색상<input id="buttonColor" type="color" value="#ffffff"></label><label>기능<select id="type"><option value="hotkey">키보드 단축키</option><option value="launch">프로그램 실행</option><option value="text">문구 자동 입력</option><option value="media">음악·영상 제어</option></select></label><label id="winLabel">Windows 설정값<div class="inputaction"><input id="winValue" placeholder="예: CTRL+S"><button id="winKeyboard" type="button">⌨ 풀키보드</button></div></label><label id="macLabel">Mac 설정값<div class="inputaction"><input id="macValue" placeholder="예: CMD+S"><button id="macKeyboard" type="button">⌨ 풀키보드</button></div></label><div class="choices" id="choices"></div><p class="hint">F1~F24를 지원합니다. 노트북의 물리적인 Fn 키는 운영체제에서 직접 전송할 수 없습니다.</p><menu><button id="deleteButton" type="button" class="danger" hidden>삭제</button><span></span><button value="cancel">취소</button><button id="save" value="default">저장</button></menu></form></dialog>
<dialog id="pageDialog"><form method="dialog"><h2>페이지 설정</h2><label>페이지 이름<input id="pageName" maxlength="20"></label><label>페이지 색상<input id="pageColor" type="color" value="#8b5cf6"></label><menu><button id="deletePage" type="button" class="danger">페이지 삭제</button><span></span><button value="cancel">취소</button><button id="savePage" value="default">저장</button></menu></form></dialog>
<dialog id="keyboardDialog" class="keyboardDialog"><div class="keyboardHead"><div><h2>가상 키보드</h2><small id="keyboardTarget">Windows 설정</small></div><button id="clearKeys" type="button">초기화</button><button id="closeKeyboard" type="button">완료</button></div><div id="keyboardValue">키를 선택하세요</div><div id="virtualKeyboard"></div></dialog>
<div id="toast"></div><script src="/presets.js"></script><script src="/app.js"></script></body></html>
